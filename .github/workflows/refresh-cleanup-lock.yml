name: Refresh cleanup lockfile

on:
  push:
    branches:
      - cleanup-repository-2026-09-11-final
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup-repository-2026-09-11-final

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build:pages

      - name: Check rendered output
        run: node --test tests/*.test.mjs

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Prune unused dependencies"
            git push origin HEAD:cleanup-repository-2026-09-11-final
          fi
